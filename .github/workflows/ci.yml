name: CI

on:
  push:
    branches: [develop, main]
  # base 브랜치를 가리지 않는다. `pull_request.branches`는 base 필터라
  # 스택 PR(base가 다른 작업 브랜치)에서 워크플로가 아예 트리거되지 않았다.
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Type · Format · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Prettier
        run: npm run format:check

      # 타입 검사가 잡지 못하는 실패를 여기서 잡는다. App Router가 빌드 중에 만드는 타입
      # (PageProps·LayoutProps)이나 프리렌더 단계의 오류가 그렇다.
      #
      # NEXT_PUBLIC_API_BASE_URL은 주지 않는다. getApiBaseUrl()이 미설정 시 null을 돌려주고
      # 예외를 던지지 않아 빌드가 통과한다(Dockerfile도 ARG 기본값을 빈 문자열로 둔다).
      - name: Build
        run: npm run build
